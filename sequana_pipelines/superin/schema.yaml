# Schema validator for the quality_control
# author: Thomas Cokelaer

type: map
mapping:
    "input_directory":
        type: str
        required: False
    "input_readtag":
        type: str
        required: False
    "input_pattern":
        type: str
        required: False
    "input_bam_pattern":
        type: str
        required: True
    "apptainers":
        type: any
    "samplesheet":
        type: str
        required: False
    "SI_reference_file":
        type: str
        required: False
    "plasmids_directory":
        type: str
        required: False


    "minimap2":
        type: map
        mapping:
            "threads":
                type: int
                required: False
            "options":
                type: str
                required: False

    "INDELs_filter":
        type: map
        mapping:
            "entropy_above":
                type: float
                required: False
            "SI_start_position":
                type: int
                required: False
            "minimal_indel_length":
                type: int
                required: False

